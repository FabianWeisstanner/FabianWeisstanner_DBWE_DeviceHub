kind = "web"
previewPath = "/"
title = "DeviceHub"
description = "A minimal DeviceHub Flask status page that displays the German status message DeviceHub läuft. No database, authentication, or API included."
version = "1.0.0"
id = "artifacts/devicehub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19211

[services.development]
run = "python3 ../../app.py"

[services.production]
run = "python3 ../../app.py"

[services.env]
PORT = "19211"
