kind = "web"
previewPath = "/"
title = "DeviceHub"
description = "A minimal DeviceHub start page that displays the German status message DeviceHub läuft. No database, authentication, or API included."
version = "1.0.0"
id = "artifacts/devicehub"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19211

[services.development]
run = "pnpm --filter @workspace/devicehub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/devicehub", "run", "build" ]
serve = "static"
publicDir = "artifacts/devicehub/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19211"
BASE_PATH = "/"
