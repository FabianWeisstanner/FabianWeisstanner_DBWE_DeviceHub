<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>DeviceHub - Registrierung</title>
</head>

<body>

    <h1>Registrierung</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <label for="username">
            Benutzername
        </label>
        <br>

        <input
            type="text"
            id="username"
            name="username"
            required
        >

        <br><br>


        <label for="email">
            E-Mail-Adresse
        </label>
        <br>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <br><br>


        <label for="password">
            Passwort
        </label>
        <br>

        <input
            type="password"
            id="password"
            name="password"
            required
        >

        <br><br>


        <button type="submit">
            Registrieren
        </button>

    </form>


    <p>
        Bereits registriert?

        <a href="{{ url_for('login') }}">
            Zur Anmeldung
        </a>
    </p>

</body>
</html>
